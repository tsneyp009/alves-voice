
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALVES VOICE</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #080d18;
  color: #e8faff;
  font-family: Arial, sans-serif;
  text-align: center;
}
main { padding: 25px; }
button {
  padding: 16px 25px;
  border: 1px solid #00d9ff;
  border-radius: 30px;
  background: #062337;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
#status { color: #00d9ff; margin: 20px; }
#result { max-width: 500px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>ALVES VOICE</h1>
  <p>Ücretsiz ses bağlantısı</p>
  <button id="mic">🎙 Mikrofonu Aç</button>
  <div id="status">Hazır</div>
  <p id="result">Konuşman burada görünecek.</p>
</main>
<script>
const status = document.getElementById("status");
const result = document.getElementById("result");
const mic = document.getElementById("mic");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

mic.addEventListener("click", () => {
  if (!SpeechRecognition) {
    status.textContent = "Bu tarayıcı ses tanımayı desteklemiyor.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "tr-TR";
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => status.textContent = "Dinliyorum...";
  recognition.onresult = event => {
    let text = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    result.textContent = text;
  };
  recognition.onerror = event => {
    status.textContent = "Ses hatası: " + event.error;
  };
  recognition.onend = () => status.textContent = "Dinleme tamamlandı.";
  recognition.start();
});
</script>
</body>
</html>
